services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rare_oud
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: "false"
    ports: ["5000:5000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
  worker-all:
    build: ./backend
    command: ["node", "workers/allWorkers.js"]
    env_file: ./backend/.env.example
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:
  redis_data:
